name: fUtilities
main: pt.flawless.fUtilities.FUtilities
description: FUtilities server utilities
version: 1.0
depend: [fAPI]
softdepend: [fChat, fPermissions]
commands:
  tp:
    description: Teleport to a specific player
  tphere:
    description: Teleport a player to you
  vida:
    description: Regenerate player HP
  invsee:
    description: Watch a player's inventory
  heal:
    description: Regenerate player's hp and hungry
  feed:
    description: Regenerate player's hungry
  clearchat:
    description: Clear all players chat
  fly:
    description: Change flight mode
  gamemode:
    description: Change player's gamemode
    aliases:
      - gm
  comandos:
    description: Open a menu to quickly call some commands
    aliases:
      - cmds
  day:
    description: Set day time to current world
  night:
    description: Set night time to current world
  clear:
    description: Clear own or other player's inventory
  repair:
    description: Repara o item na mão ou todo o inventário
    usage: /repair [all]
    permission: futilities.repair
  god:
    description: Alterna o modo deus (sem dano, continuas em survival)
    usage: /god
    permission: futilities.god
  stack:
    description: Junta todos os itens iguais ao da mão em pilhas de 64
    usage: /stack
    permission: futilities.stack
  broadcast:
    description: Broadcast a message to all players
  prefs:
    description: Abre o menu de preferências
    usage: /prefs
  warp:
    description: Teleporta para um warp
    usage: /warp <lugar>
    aliases:
      - warps
      - ir
  setwarp:
    description: Define um warp na tua posição
    usage: /setwarp <lugar> [grupo]
  delwarp:
    description: Apaga um warp
    usage: /delwarp <lugar>
permissions:
  futilities.warp.admin:
    description: Criar e apagar warps
  futilities.warp.bypass:
    description: Teleporte de warps sem espera
  futilities.repair:
    description: Usar /repair
  futilities.god:
    description: Usar /god
  futilities.stack:
    description: Usar /stack
