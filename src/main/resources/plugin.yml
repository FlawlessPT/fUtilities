name: fUtilities
main: pt.flawless.fUtilities.FUtilities
description: FUtilities server utilities
version: 1.0
api-version: '1.21'
depend: [fAPI]
softdepend: [fChat, fPermissions, fFriends]
commands:
  tp:
    description: Teleport to a specific player
  tphere:
    description: Teleport a player to you
  vida:
    description: Regenerate player HP
  invsee:
    description: Watch a player's inventory
  heal:
    description: Regenerate player's hp and hungry
  feed:
    description: Regenerate player's hungry
  clearchat:
    description: Clear all players chat
  fly:
    description: Change flight mode
  gamemode:
    description: Change player's gamemode
    aliases:
      - gm
  comandos:
    description: Open a menu to quickly call some commands
    aliases:
      - cmds
  day:
    description: Set day time to current world
  night:
    description: Set night time to current world
  clear:
    description: Clear own or other player's inventory
  repair:
    description: Repara o item na mão ou todo o inventário
    usage: /repair [all]
    permission: futilities.repair
  god:
    description: Alterna o modo deus (sem dano, continuas em survival)
    usage: /god
    permission: futilities.god
  tpall:
    description: Teleporta todos os jogadores para ti ou para um jogador
    usage: /tpall [jogador]
    permission: futilities.tpall
  vanish:
    description: Alterna o vanish (ficas invisível para os jogadores)
    usage: /vanish
    aliases: [v]
    permission: futilities.vanish
  stack:
    description: Junta todos os itens iguais ao da mão em pilhas de 64
    usage: /stack
    permission: futilities.stack
  enderchest:
    description: Abre o teu enderchest
    usage: /enderchest
    aliases: [echest, ec]
    permission: futilities.enderchest
  bau:
    description: Abre um baú pessoal
    usage: /bau [número]
    aliases: [chest]
    permission: futilities.bau
  iteminfo:
    description: Mostra o material e os detalhes do item na mão
    usage: /iteminfo
    aliases: [mat]
    permission: futilities.iteminfo
  tpa:
    description: Pede para te teleportares para um jogador
    usage: /tpa <jogador>
  tpaccept:
    description: Aceita um pedido de teleporte
    usage: /tpaccept [jogador]
  tpdeny:
    description: Recusa um pedido de teleporte
    usage: /tpdeny [jogador]
  tell:
    description: Envia uma mensagem privada
    usage: /tell <jogador> <mensagem>
    aliases: [msg, w, m]
  r:
    description: Responde à última mensagem privada
    usage: /r <mensagem>
    aliases: [reply]
  arena:
    description: Teleporta para uma arena
    usage: /arena <nome>
  arenas:
    description: Abre o menu das arenas
    usage: /arenas
  setarena:
    description: Define a localização de uma arena
    usage: /setarena <nome>
    permission: futilities.arena.admin
  broadcast:
    description: Broadcast a message to all players
  prefs:
    description: Abre o menu de preferências
    usage: /prefs
  warp:
    description: Teleporta para um warp
    usage: /warp <lugar>
    aliases:
      - warps
      - ir
  setwarp:
    description: Define um warp na tua posição
    usage: /setwarp <lugar> [grupo]
  delwarp:
    description: Apaga um warp
    usage: /delwarp <lugar>
permissions:
  futilities.warp.admin:
    description: Criar e apagar warps
  futilities.warp.bypass:
    description: Teleporte de warps sem espera
  futilities.repair:
    description: Usar /repair
  futilities.god:
    description: Usar /god
  futilities.stack:
    description: Usar /stack
  futilities.enderchest:
    description: Usar /enderchest
  futilities.bau:
    description: Usar /bau (baú 1); os seguintes pedem futilities.bau.<número>
  futilities.bau.2:
    description: Baú pessoal 2
  futilities.iteminfo:
    description: Usar /iteminfo
  futilities.arena.admin:
    description: Definir arenas (/setarena)
  futilities.vanish:
    description: Usar /vanish
  futilities.vanish.see:
    description: Ver os jogadores em vanish
  futilities.tpall:
    description: Usar /tpall
